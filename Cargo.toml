[workspace]
resolver = "2"
members = [
    "crates/forge-cli",
    "crates/forge-sandbox",
    "crates/forge-sandbox-worker",
    "crates/forge-manifest",
    "crates/forge-server",
    "crates/forge-client",
    "crates/forge-config",
    "crates/forge-error",
    "crates/forge-audit",
    "crates/forge-test-server",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.91.1"
repository = "https://github.com/postrv/forgemax"

[workspace.lints.clippy]
# Production code should avoid panicking APIs — use proper error handling.
# These are warnings (not deny) so test code is unaffected by CI -D warnings
# when using #[cfg_attr(test, allow(...))] or per-module allows.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
# Core runtime
deno_core = "0.400"
# v8 is a transitive dependency of deno_core, but we declare it here so we
# can enable the `simdutf` feature, which deno_core 0.400 references at
# link time without enabling itself. Without this feature the link fails
# with undefined symdutf__* symbols against the standard prebuilt archive.
v8 = { version = "147.4", features = ["simdutf"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP protocol
rmcp = { version = "1.2", features = ["server", "macros", "transport-io"] }
schemars = "1.0"

# AST validation (oxc)
oxc_parser = "0.130"
oxc_ast = "0.130"
oxc_span = "0.130"
oxc_allocator = "0.130"

# Fuzzy matching
strsim = "0.11"

# Regex
regex = "1"

# Lock-free data structures
arc-swap = "1"

# File watching
notify = "8"

# Security / audit
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
forge-sandbox = { path = "crates/forge-sandbox", version = "0.6.0" }
forge-manifest = { path = "crates/forge-manifest", version = "0.6.0" }
forge-server = { path = "crates/forge-server", version = "0.6.0" }
forge-client = { path = "crates/forge-client", version = "0.6.0" }
forge-config = { path = "crates/forge-config", version = "0.6.0" }
forge-error = { path = "crates/forge-error", version = "0.6.0" }
forge-audit = { path = "crates/forge-audit", version = "0.6.0" }
