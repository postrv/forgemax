name: Build Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Whether to upload build artifacts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # See ci.yml — v8 147.4+ prebuilts need macOS 12.0+ deployment target.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: forgemax-linux-x86_64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: forgemax-macos-x86_64
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: forgemax-macos-aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: forgemax-windows-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: ./.github/actions/fetch-v8
        with:
          target: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/forgemax
          strip target/${{ matrix.target }}/release/forgemax-worker

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          strip -x target/${{ matrix.target }}/release/forgemax
          strip -x target/${{ matrix.target }}/release/forgemax-worker

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/forgemax staging/
          cp target/${{ matrix.target }}/release/forgemax-worker staging/
          cp forge.toml.example staging/

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          copy target\${{ matrix.target }}\release\forgemax.exe staging\
          copy target\${{ matrix.target }}\release\forgemax-worker.exe staging\
          copy forge.toml.example staging\

      - name: Smoke test native release binaries
        shell: bash
        run: |
          HOST_TARGET=$(rustc -vV | sed -n 's/^host: //p')
          if [ "${{ matrix.target }}" != "$HOST_TARGET" ]; then
            echo "::error::Native release smoke needs ${{ matrix.target }}, got $HOST_TARGET"
            exit 1
          fi
          python tests/release_binary_smoke.py --bin-dir staging

      - name: Upload artifact
        if: github.event_name != 'workflow_dispatch' && inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: staging/
          retention-days: 7
