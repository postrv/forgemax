name: Installer Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check npm installer and launcher
        run: node --test npm/install.test.js npm/pack.test.js
      - name: Check Unix installer
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          python3 tests/installers/test_shell.py
      - name: Check PowerShell installer
        shell: pwsh
        run: ./tests/installers/test_powershell.ps1
