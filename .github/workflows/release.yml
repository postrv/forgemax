name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # See ci.yml — v8 147.4+ prebuilts need macOS 12.0+ deployment target.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  installers:
    name: Installer verification
    uses: ./.github/workflows/installer-tests.yml

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/fetch-v8
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/fetch-v8
      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(jq -r .version npm/package.json)
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match npm/package.json ($NPM_VERSION)"
            exit 1
          fi
          CARGO_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "forgemax") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
      - name: Verify --version output
        run: |
          cargo build --locked --release -p forgemax
          VERSION_OUTPUT=$(./target/release/forgemax --version)
          EXPECTED="forgemax ${GITHUB_REF_NAME#v}"
          if [ "$VERSION_OUTPUT" != "$EXPECTED" ]; then
            echo "::error::--version output ($VERSION_OUTPUT) does not match expected ($EXPECTED)"
            exit 1
          fi
      - name: Security gate - AST validator compiled into release binary
        # The oxc AST validator (forge-sandbox `ast-validator` default feature) is
        # a static JavaScript capability defense for submitted code, not a
        # detector of prompt injection in tool results. A --no-default-features build
        # (or dropping the forge-sandbox default) would silently downgrade it to
        # regex-only. Fail the release if the validator's parser crate is absent
        # from forgemax's dependency graph.
        run: |
          cargo tree --locked -p forgemax --edges normal,build > release-dependencies.txt
          if ! grep -F oxc_parser release-dependencies.txt >/dev/null; then
            echo "::error::forgemax release build is missing the oxc AST validator (ast-validator feature) - static JavaScript validation would be regex-only. Do not ship --no-default-features or disable forge-sandbox defaults."
            exit 1
          fi
          echo "AST validator (oxc_parser) confirmed in forgemax dependency graph."

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit --deny unsound

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/fetch-v8
      - name: Build all binaries (needed for integration tests)
        run: cargo build --locked --workspace
      - run: cargo test --locked --workspace --verbose

  publish-crates:
    name: Publish to crates.io
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/fetch-v8
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CRATES=(
            forge-error
            forge-audit
            forge-config
            forge-manifest
            forge-sandbox
            forge-sandbox-worker
            forge-server
            forge-client
            forgemax
          )

          wait_for_crate() {
            local crate="$1" version="$2"
            echo "Waiting for $crate $version to appear in crates.io index..."
            for i in $(seq 1 30); do
              sleep 10
              cargo update --dry-run 2>&1 || true
              if cargo search "$crate" 2>/dev/null | grep -q "\"$version\""; then
                echo "$crate $version is now available"
                return 0
              fi
              echo "  attempt $i/30: $crate $version not yet indexed..."
            done
            echo "::warning::Timed out waiting for $crate $version in index (5 min)"
            return 1
          }

          FAILED=()
          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            PUBLISHED=false
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$crate" --allow-dirty 2>&1; then
                PUBLISHED=true
                break
              fi
              OUTPUT=$(cargo publish -p "$crate" --allow-dirty 2>&1 || true)
              if echo "$OUTPUT" | grep -qE "already uploaded|already exists"; then
                echo "$crate $VERSION is already published"
                PUBLISHED=true
                break
              fi
              echo "Attempt $attempt/5 failed for $crate, waiting for index sync..."
              sleep 30
            done
            echo "::endgroup::"

            if [ "$PUBLISHED" = true ]; then
              wait_for_crate "$crate" "$VERSION" || true
            else
              echo "::error::Failed to publish $crate after 5 attempts"
              FAILED+=("$crate")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed to publish: ${FAILED[*]}"
            exit 1
          fi

  build-binaries:
    name: Build binaries
    needs: [lint, version-check, security, deny, test, installers]
    uses: ./.github/workflows/build-binaries.yml
    with:
      upload-artifacts: true

  release:
    name: Create GitHub Release
    needs: [build-binaries, publish-crates]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          # Unix targets → tar.gz
          for dir in forgemax-linux-x86_64 forgemax-macos-x86_64 forgemax-macos-aarch64; do
            for file in forgemax forgemax-worker forge.toml.example; do
              test -s "artifacts/$dir/$file" || { echo "::error::Missing $dir/$file"; exit 1; }
            done
            # Artifact download does not preserve executable permissions.
            chmod 755 "artifacts/$dir/forgemax" "artifacts/$dir/forgemax-worker"
            tar czf "release/forgemax-v${VERSION}-${dir#forgemax-}.tar.gz" \
              -C "artifacts/$dir" forgemax forgemax-worker forge.toml.example
          done

          # Windows → zip
          for file in forgemax.exe forgemax-worker.exe forge.toml.example; do
            test -s "artifacts/forgemax-windows-x86_64/$file" || { echo "::error::Missing Windows $file"; exit 1; }
          done
          (cd "artifacts/forgemax-windows-x86_64" && \
            zip "../../release/forgemax-v${VERSION}-windows-x86_64.zip" \
              forgemax.exe forgemax-worker.exe forge.toml.example)

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename forgemax-sbom --top-level
          mv crates/forge-cli/forgemax-sbom.json release/forgemax-sbom.json

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- *.tar.gz *.zip forgemax-sbom.json > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm-publish:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: cd npm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
