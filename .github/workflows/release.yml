name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # See ci.yml — v8 147.4+ prebuilts need macOS 12.0+ deployment target.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  installers:
    name: Installer verification
    uses: ./.github/workflows/installer-tests.yml

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
          arguments: --locked --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/fetch-v8
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/fetch-v8
      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(jq -r .version npm/package.json)
          if [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match npm/package.json ($NPM_VERSION)"
            exit 1
          fi
          CARGO_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "forgemax") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
      - name: Verify --version output
        run: |
          cargo build --locked --release -p forgemax
          VERSION_OUTPUT=$(./target/release/forgemax --version)
          EXPECTED="forgemax ${GITHUB_REF_NAME#v}"
          if [ "$VERSION_OUTPUT" != "$EXPECTED" ]; then
            echo "::error::--version output ($VERSION_OUTPUT) does not match expected ($EXPECTED)"
            exit 1
          fi
      - name: Verify locked crate packaging
        run: cargo package --locked --workspace --exclude forge-test-server --no-verify
      - name: Security gate - AST validator compiled into release binary
        # The oxc AST validator (forge-sandbox `ast-validator` default feature) is
        # a static JavaScript capability defense for submitted code, not a
        # detector of prompt injection in tool results. A --no-default-features build
        # (or dropping the forge-sandbox default) would silently downgrade it to
        # regex-only. Fail the release if the validator's parser crate is absent
        # from forgemax's dependency graph.
        run: |
          cargo tree --locked -p forgemax --edges normal,build > release-dependencies.txt
          if ! grep -F oxc_parser release-dependencies.txt >/dev/null; then
            echo "::error::forgemax release build is missing the oxc AST validator (ast-validator feature) - static JavaScript validation would be regex-only. Do not ship --no-default-features or disable forge-sandbox defaults."
            exit 1
          fi
          echo "AST validator (oxc_parser) confirmed in forgemax dependency graph."

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --version '=0.23.0' --locked
      - name: Run security audit
        run: cargo audit --deny unsound

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/fetch-v8
      - name: Build all binaries (needed for integration tests)
        run: cargo build --locked --workspace
      - run: cargo test --locked --workspace --verbose

  publish-crates:
    name: Publish to crates.io
    needs: [build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/fetch-v8
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" bash .github/scripts/publish-crates.sh

  build-binaries:
    name: Build binaries
    needs: [lint, version-check, security, deny, test, installers]
    uses: ./.github/workflows/build-binaries.yml
    with:
      upload-artifacts: true

  release:
    name: Create GitHub Release
    needs: [build-binaries, publish-crates]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          # Unix targets → tar.gz
          for dir in forgemax-linux-x86_64 forgemax-macos-x86_64 forgemax-macos-aarch64; do
            for file in forgemax forgemax-worker forge.toml.example; do
              test -s "artifacts/$dir/$file" || { echo "::error::Missing $dir/$file"; exit 1; }
            done
            # Artifact download does not preserve executable permissions.
            chmod 755 "artifacts/$dir/forgemax" "artifacts/$dir/forgemax-worker"
            tar czf "release/forgemax-v${VERSION}-${dir#forgemax-}.tar.gz" \
              -C "artifacts/$dir" forgemax forgemax-worker forge.toml.example
          done

          # Windows → zip
          for file in forgemax.exe forgemax-worker.exe forge.toml.example; do
            test -s "artifacts/forgemax-windows-x86_64/$file" || { echo "::error::Missing Windows $file"; exit 1; }
          done
          (cd "artifacts/forgemax-windows-x86_64" && \
            zip "../../release/forgemax-v${VERSION}-windows-x86_64.zip" \
              forgemax.exe forgemax-worker.exe forge.toml.example)

      - name: Generate gateway and worker SBOMs
        run: |
          cargo install cargo-cyclonedx --version '=0.5.10' --locked
          cargo cyclonedx --format json --override-filename forgemax-sbom --target all
          git diff --exit-code -- Cargo.lock
          mv crates/forge-cli/forgemax-sbom.json release/forgemax-sbom.json
          mv crates/forge-sandbox-worker/forgemax-sbom.json release/forgemax-worker-sbom.json

      - name: Generate checksums
        run: |
          cd release
          sha256sum -- *.tar.gz *.zip forgemax-sbom.json forgemax-worker-sbom.json > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm-publish:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: cd npm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
